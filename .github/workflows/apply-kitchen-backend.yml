name: Apply and validate Kitchen backend

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - tools/apply-kitchen-backend.py
      - tools/prepare-kitchen-backend.py
      - tools/finish-kitchen-backend.py
      - .github/workflows/apply-kitchen-backend.yml

permissions:
  contents: write

jobs:
  backend:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply checked backend transformations
        shell: pwsh
        run: |
          python tools/prepare-kitchen-backend.py
          python tools/apply-kitchen-backend.py
          python tools/finish-kitchen-backend.py
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          git diff --check
      - name: Commit validated backend checkpoint
        shell: pwsh
        run: |
          Remove-Item tools/apply-kitchen-backend.py
          Remove-Item tools/prepare-kitchen-backend.py
          Remove-Item tools/finish-kitchen-backend.py
          Remove-Item .github/workflows/apply-kitchen-backend.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Complete Comfy Kitchen backend orchestration"
          git push origin HEAD:feature/comfy-kitchen-management
