name: Apply Comfy Kitchen documentation

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - .github/workflows/apply-kitchen-docs.yml

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0
      - name: Apply asserted documentation edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          readme = replace_once(
              readme,
              "It currently manages three repository kinds:\n\n* **core** — the main ComfyUI repository at the installation root\n* **frontend** — a dedicated managed `ComfyUI_frontend` checkout outside `custom_nodes`\n* **custom_node** — repositories under `custom_nodes/`",
              "It currently manages four repository kinds:\n\n* **core** — the main ComfyUI repository at the installation root\n* **frontend** — a dedicated managed `ComfyUI_frontend` checkout outside `custom_nodes`\n* **kitchen** — an opt-in managed `Comfy-Org/comfy-kitchen` source checkout, materialized into the installation's Python environment\n* **custom_node** — repositories under `custom_nodes/`",
              "repo kinds",
          )

          readme = replace_once(
              readme,
              "* `deps.rs` — dependency detection / planning / execution for Python and frontend package managers\n* `process.rs` — starts / stops / restarts a managed child process from a launch profile",
              "* `deps.rs` — dependency detection / planning / execution for Python and frontend package managers\n* `kitchen.rs` — Comfy Kitchen runtime probing, source-wheel materialization, provenance checks, and restoration of the requirement declared by ComfyUI\n* `process.rs` — starts / stops / restarts a managed child process from a launch profile",
              "backend modules",
          )

          readme = replace_once(
              readme,
              "The app does **not** execute arbitrary install scripts beyond the supported manifest-driven flows.\n\n---\n\n## Setup",
              "The app does **not** execute arbitrary install scripts beyond the supported manifest-driven flows.\n\n### Comfy Kitchen source overrides\n\nComfy Kitchen is handled as a project materialization rather than generic Python dependency sync. When source management is enabled, Patcher initializes the checkout's required submodules, asks the checkout's normal PEP 517/setuptools build to produce a wheel, installs that wheel into the configured installation Python, and records source/runtime provenance separately. Upstream Comfy Kitchen remains responsible for CUDA/HIP compiler discovery and architecture policy.\n\nA Patcher-managed Kitchen source override is reasserted after Patcher-controlled core/custom-node dependency installs if those installs replace the active `comfy-kitchen` distribution.\n\n---\n\n## Setup",
              "Kitchen dependency section",
          )

          readme = replace_once(
              readme,
              "### 4. Install or patch a custom node manually",
              "### 4. Manage Comfy Kitchen source\n\nThe **Kitchen** panel probes the `comfy-kitchen` distribution through the installation's configured Python even when no source checkout is managed. Source management is opt-in.\n\nWhen enabled, Patcher accepts targets from the official `https://github.com/Comfy-Org/comfy-kitchen` repository, uses a fixed sibling checkout named `comfy-kitchen` beside the ComfyUI root, materializes the selected base/PR stack into a wheel, and installs that wheel into the managed Python environment. Checkout state and installed-runtime provenance are tracked independently so stale, missing, replaced, or import-failing runtimes can be detected.\n\n**Restore ComfyUI Kitchen** reinstalls the exact `comfy-kitchen` requirement declared by the current ComfyUI checkout, clears the tracked Kitchen source target, and leaves the source checkout on disk. A later **Update all** therefore does not silently reactivate the source override. Rollback/checkpoint restore can return to the prior source-managed runtime.\n\nBefore an active source-managed Kitchen checkout is disabled, untracked, or uninstalled, Patcher restores the ComfyUI-declared runtime requirement first. Start/Restart also refuse to launch when an active managed source override is no longer coherent with its recorded source revision/runtime provenance.\n\n### 5. Install or patch a custom node manually",
              "Kitchen usage section",
          )
          readme = replace_once(readme, "### 5. Use the ComfyUI-Manager registry browser", "### 6. Use the ComfyUI-Manager registry browser", "usage heading 5")
          readme = replace_once(readme, "### 6. Update and rollback", "### 7. Update and rollback", "usage heading 6")
          readme = replace_once(readme, "### 7. Start / Stop / Restart", "### 8. Start / Stop / Restart", "usage heading 7")

          readme = replace_once(
              readme,
              "* if a managed frontend repo and ComfyUI install live on different filesystems, replacement / backup handling is designed to avoid cross-device rename failures by backing up beside the target path",
              "* if a managed frontend repo and ComfyUI install live on different filesystems, replacement / backup handling is designed to avoid cross-device rename failures by backing up beside the target path\n* Comfy Kitchen source builds require the native compiler/toolchain expected by the selected upstream Kitchen backend; Patcher does not replace upstream CUDA/HIP architecture selection\n* managed Kitchen source targets are restricted to the official Comfy-Org/comfy-kitchen remote; unrelated remotes are rejected rather than being treated as interchangeable runtime providers",
              "operational caveats",
          )

          validation_anchor = "### Core patch\n\n* patch to a branch URL\n* patch to a commit URL\n* patch to a PR URL\n* verify `currentBranch`, `currentHeadSha`, and tracked state update correctly"
          validation_replacement = validation_anchor + "\n\n### Comfy Kitchen\n\n* register/reconcile an installation with and without an installed `comfy-kitchen` distribution and verify the runtime probe remains independent of source-checkout discovery\n* install an official Kitchen branch/commit/PR target and verify required submodules initialize before the source wheel is built and installed\n* verify the recorded materialized source HEAD and installed-runtime provenance match the active source build\n* run a Patcher-controlled core/custom-node dependency sync that replaces `comfy-kitchen` and verify the active Kitchen source override is reasserted\n* use **Restore ComfyUI Kitchen** and verify the current ComfyUI requirement is installed, source tracking is cleared, the checkout remains on disk, and **Update all** does not reactivate it\n* rollback/restore a Kitchen checkpoint and verify both checkout/tracked state and runtime ownership are restored coherently\n* replace or remove the installed source runtime out of band and verify Start/Restart refuses an incoherent active override\n* force a fresh Kitchen source install/materialization failure and verify only operation-owned checkout/DB state is cleaned up while any retained pre-existing path is restored"
          readme = replace_once(readme, validation_anchor, validation_replacement, "Kitchen validation checklist")
          readme_path.write_text(readme, encoding="utf-8", newline="\n")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = replace_once(
              changelog,
              "remain available on the [GitHub Releases](https://github.com/xmarre/ComfyUI-Patcher/releases) page.\n\n## [0.1.18] - 2026-08-30",
              "remain available on the [GitHub Releases](https://github.com/xmarre/ComfyUI-Patcher/releases) page.\n\n## Unreleased\n\n### Added\n\n- Added first-class Comfy Kitchen management as a separate repository/runtime layer, including official-source target resolution, stacked PR support, recursive submodule initialization, source-wheel materialization, and runtime provenance tracking.\n- Added an installation-level Kitchen runtime probe and UI that reports installed/import state independently of whether a source checkout is managed.\n- Added durable **Restore ComfyUI Kitchen** behavior that returns runtime ownership to the requirement declared by the current ComfyUI checkout without deleting the source checkout.\n\n### Safety\n\n- Patcher reasserts an active managed Kitchen source build after Patcher-controlled Python dependency installs replace it, and blocks Start/Restart when active Kitchen runtime provenance is incoherent.\n- Kitchen rollback/checkpoint restore includes runtime materialization state; failed fresh source installs clean up only operation-owned state and preserve/restore retained pre-existing paths.\n\n## [0.1.18] - 2026-08-30",
              "changelog unreleased",
          )
          changelog_path.write_text(changelog, encoding="utf-8", newline="\n")
          PY
          git diff --check -- README.md CHANGELOG.md
      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-kitchen-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Document Comfy Kitchen management"
          git push origin HEAD:feature/comfy-kitchen-management
