name: Apply and validate Kitchen hostile review fixes

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - .github/workflows/apply-kitchen-head-fix-strict.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0

      - name: Reconstruct clean implementation and apply hostile review fixes
        shell: bash
        run: |
          set -euo pipefail
          git checkout 48ddc3c5a1c6cb53555c4fb1edcb6c588121489b -- \
            CHANGELOG.md \
            README.md \
            src-tauri/src/db.rs \
            src-tauri/src/kitchen.rs \
            src-tauri/src/lib.rs \
            src/components/RepoCard.tsx
          python tools/apply_kitchen_hostile_review_fixes.py
          grep -Fq 'cannot materialize Comfy Kitchen source: repository HEAD could not be resolved' src-tauri/src/kitchen.rs
          grep -Fq 'ManagedPythonOverrideMode::Deferred' src-tauri/src/lib.rs
          grep -Fq 'stopping Kitchen source management without changing the currently installed comfy-kitchen runtime' src-tauri/src/lib.rs
          grep -Fq 'default_remote_for_repo_kind' src-tauri/src/lib.rs
          grep -Fq "VALUES ('r','i','\"custom_node\"','old-node'" src-tauri/src/db.rs
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('CHANGELOG.md'),
              Path('README.md'),
              Path('src-tauri/src/db.rs'),
              Path('src-tauri/src/kitchen.rs'),
              Path('src-tauri/src/lib.rs'),
              Path('src/components/RepoCard.tsx'),
          ]
          bad = []
          for path in paths:
              for number, line in enumerate(path.read_bytes().splitlines(), 1):
                  logical = line[:-1] if line.endswith(b'\r') else line
                  if logical.endswith((b' ', b'\t')):
                      bad.append(f'{path}:{number}')
          if bad:
              raise SystemExit('trailing whitespace: ' + ', '.join(bad))
          PY

      - name: Validate official frontend and Rust CI paths
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          lock_before="$(git hash-object src-tauri/Cargo.lock)"
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --manifest-path src-tauri/Cargo.toml
          git checkout -- src-tauri/Cargo.lock
          test "$(git hash-object src-tauri/Cargo.lock)" = "$lock_before"
          git diff --exit-code -- src-tauri/Cargo.lock

      - name: Commit only validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-kitchen-head-fix-strict.yml
          git rm tools/apply_kitchen_hostile_review_fixes.py
          if [ -f .github/workflows/fix-kitchen-head-provenance.yml ]; then
            git rm .github/workflows/fix-kitchen-head-provenance.yml
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            README.md \
            src-tauri/src/db.rs \
            src-tauri/src/kitchen.rs \
            src-tauri/src/lib.rs \
            src/components/RepoCard.tsx
          test -z "$(git diff --cached --name-only | grep '^src-tauri/Cargo.lock$' || true)"
          git commit -m "Address Kitchen orchestration review findings"
          git push origin HEAD:feature/comfy-kitchen-management
