name: Apply Kitchen HEAD provenance fix strictly

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - .github/workflows/apply-kitchen-head-fix-strict.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0
      - name: Apply minimal fix from clean implementation file
        shell: bash
        run: |
          set -euo pipefail
          git checkout 48ddc3c5a1c6cb53555c4fb1edcb6c588121489b -- src-tauri/src/kitchen.rs
          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/kitchen.rs")
          text = path.read_text(encoding="utf-8")
          old = '    let head_sha = rev_parse(repo_path, "HEAD").await?;'
          new = '''    let head_sha = rev_parse(repo_path, "HEAD").await?.ok_or_else(|| {
              AppError::Git(
                  "cannot materialize Comfy Kitchen source: repository HEAD could not be resolved"
                      .to_string(),
              )
          })?;'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one HEAD resolution anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          grep -Fq 'let head_sha = rev_parse(repo_path, "HEAD").await?.ok_or_else(|| {' src-tauri/src/kitchen.rs
          grep -Fq 'cannot materialize Comfy Kitchen source: repository HEAD could not be resolved' src-tauri/src/kitchen.rs
          git diff --check -- src-tauri/src/kitchen.rs
      - name: Validate ordinary and locked Rust paths
        shell: bash
        run: |
          set -euo pipefail
          lock_before="$(git hash-object src-tauri/Cargo.lock)"
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --manifest-path src-tauri/Cargo.toml
          git checkout -- src-tauri/Cargo.lock
          test "$(git hash-object src-tauri/Cargo.lock)" = "$lock_before"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          git diff --exit-code -- src-tauri/Cargo.lock
      - name: Commit only the validated fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-kitchen-head-fix-strict.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/kitchen.rs
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply-kitchen-head-fix-strict.yml' 'src-tauri/src/kitchen.rs' | sort)"
          test "$changed" = "$expected"
          git commit -m "Require resolvable Kitchen HEAD before materialization"
          git push origin HEAD:feature/comfy-kitchen-management
