name: Apply and validate Kitchen hostile review fixes

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - .github/workflows/apply-kitchen-head-fix-strict.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0

      - name: Reconstruct clean implementation and apply hostile review fixes
        shell: bash
        run: |
          set -euo pipefail
          git checkout 48ddc3c5a1c6cb53555c4fb1edcb6c588121489b -- \
            CHANGELOG.md \
            README.md \
            src-tauri/src/db.rs \
            src-tauri/src/kitchen.rs \
            src-tauri/src/lib.rs \
            src/components/RepoCard.tsx
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_kitchen_hostile_review_fixes.py')
          text = path.read_text(encoding='utf-8')

          # Narrow the checkpoint signature transformation to the Kitchen-aware helper.
          old = '''replace_block(
              "src-tauri/src/lib.rs",
              ''' + "'''" + '''    checkpoint: &RepoCheckpoint,
              restore_stash: bool,
          ) -> AppResult<()> {''' + "'''" + ''',
              ''' + "'''" + '''    checkpoint: &RepoCheckpoint,
              restore_stash: bool,
              force_kitchen_runtime_rebuild: bool,
          ) -> AppResult<()> {''' + "'''" + ''',
              "Kitchen checkpoint recovery signature",
          )'''
          new = '''replace_block(
              "src-tauri/src/lib.rs",
              ''' + "'''" + '''async fn restore_checkpoint_with_kitchen_runtime(
              state: &AppState,
              app: &AppHandle,
              operation_id: &str,
              installation: &Installation,
              repo: &ManagedRepo,
              checkpoint: &RepoCheckpoint,
              restore_stash: bool,
          ) -> AppResult<()> {''' + "'''" + ''',
              ''' + "'''" + '''async fn restore_checkpoint_with_kitchen_runtime(
              state: &AppState,
              app: &AppHandle,
              operation_id: &str,
              installation: &Installation,
              repo: &ManagedRepo,
              checkpoint: &RepoCheckpoint,
              restore_stash: bool,
              force_kitchen_runtime_rebuild: bool,
          ) -> AppResult<()> {''' + "'''" + ''',
              "Kitchen checkpoint recovery signature",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one broad checkpoint transform, found {text.count(old)}')
          text = text.replace(old, new, 1)

          # Replace the lifecycle part of the transformation script with function-specific anchors.
          start_marker = '# 10. Kitchen lifecycle policy: untrack leaves the currently installed runtime untouched.'
          end_marker = '# 11. Pure regression tests pin the orchestration/lifecycle invariants.'
          start = text.index(start_marker)
          end = text.index(end_marker)
          lifecycle = r'''# 10. Kitchen lifecycle policy: untrack leaves the currently installed runtime untouched.
          insert_lifecycle = ''' + "'''" + '''fn kitchen_lifecycle_requires_comfy_restore(
              kind: &RepoKind,
              has_materialization: bool,
              operation_kind: &OperationKind,
          ) -> bool {
              *kind == RepoKind::Kitchen
                  && has_materialization
                  && matches!(
                      operation_kind,
                      OperationKind::UninstallRepo | OperationKind::DisableRepo
                  )
          }

          #[tauri::command]
          async fn uninstall_repo(''' + "'''" + '''
          replace_block(
              "src-tauri/src/lib.rs",
              ''' + "'''" + '''#[tauri::command]
          async fn uninstall_repo(''' + "'''" + ''',
              insert_lifecycle,
              "Kitchen lifecycle policy helper",
          )
          replace_block(
              "src-tauri/src/lib.rs",
              ''' + "'''" + '''            format!("uninstalling {}", repo.display_name),
                  );
                  if repo.kind == RepoKind::Kitchen && repo.materialization_state.is_some() {''' + "'''" + ''',
              ''' + "'''" + '''            format!("uninstalling {}", repo.display_name),
                  );
                  if kitchen_lifecycle_requires_comfy_restore(
                      &repo.kind,
                      repo.materialization_state.is_some(),
                      &OperationKind::UninstallRepo,
                  ) {''' + "'''" + ''',
              "Kitchen uninstall restore policy",
          )
          replace_block(
              "src-tauri/src/lib.rs",
              ''' + "'''" + '''                repo.display_name,
                          disabled_path.to_string_lossy()
                      ),
                  );
                  if repo.kind == RepoKind::Kitchen && repo.materialization_state.is_some() {''' + "'''" + ''',
              ''' + "'''" + '''                repo.display_name,
                          disabled_path.to_string_lossy()
                      ),
                  );
                  if kitchen_lifecycle_requires_comfy_restore(
                      &repo.kind,
                      repo.materialization_state.is_some(),
                      &OperationKind::DisableRepo,
                  ) {''' + "'''" + ''',
              "Kitchen disable restore policy",
          )
          replace_block(
              "src-tauri/src/lib.rs",
              ''' + "'''" + '''        let _ = run_untrack_repo(app, state_handle, installation, repo, op_id).await;''' + "'''" + ''',
              ''' + "'''" + '''        let _ = run_untrack_repo(app, state_handle, repo, op_id).await;''' + "'''" + ''',
              "Kitchen untrack spawn",
          )
          replace_block(
              "src-tauri/src/lib.rs",
              ''' + "'''" + '''async fn run_untrack_repo(
              app: AppHandle,
              state: AppState,
              installation: Installation,
              repo: ManagedRepo,
              operation_id: String,
          ) -> AppResult<()> {''' + "'''" + ''',
              ''' + "'''" + '''async fn run_untrack_repo(
              app: AppHandle,
              state: AppState,
              repo: ManagedRepo,
              operation_id: String,
          ) -> AppResult<()> {''' + "'''" + ''',
              "Kitchen untrack signature",
          )
          old_untrack_restore = ''' + "'''" + '''        if repo.kind == RepoKind::Kitchen && repo.materialization_state.is_some() {
              restore_comfy_requirement_for_repo(
                  &state,
                  &app,
                  &operation_id,
                  &installation,
                  &repo,
              )
              .await?;
          }''' + "'''" + '''
          new_untrack_restore = ''' + "'''" + '''        if repo.kind == RepoKind::Kitchen && repo.materialization_state.is_some() {
              log_operation(
                  &state,
                  &app,
                  &operation_id,
                  "materialization",
                  "warn",
                  "stopping Kitchen source management without changing the currently installed comfy-kitchen runtime; Patcher will no longer reassert this source build",
              );
          }''' + "'''" + '''
          replace_block("src-tauri/src/lib.rs", old_untrack_restore, new_untrack_restore, "Kitchen untrack runtime preservation")

          '''
          text = text[:start] + lifecycle + text[end:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python tools/apply_kitchen_hostile_review_fixes.py
          grep -Fq 'cannot materialize Comfy Kitchen source: repository HEAD could not be resolved' src-tauri/src/kitchen.rs
          grep -Fq 'ManagedPythonOverrideMode::Deferred' src-tauri/src/lib.rs
          grep -Fq 'stopping Kitchen source management without changing the currently installed comfy-kitchen runtime' src-tauri/src/lib.rs
          grep -Fq 'default_remote_for_repo_kind' src-tauri/src/lib.rs
          grep -Fq "VALUES ('r','i','\"custom_node\"','old-node'" src-tauri/src/db.rs
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('CHANGELOG.md'),
              Path('README.md'),
              Path('src-tauri/src/db.rs'),
              Path('src-tauri/src/kitchen.rs'),
              Path('src-tauri/src/lib.rs'),
              Path('src/components/RepoCard.tsx'),
          ]
          bad = []
          for path in paths:
              for number, line in enumerate(path.read_bytes().splitlines(), 1):
                  logical = line[:-1] if line.endswith(b'\r') else line
                  if logical.endswith((b' ', b'\t')):
                      bad.append(f'{path}:{number}')
          if bad:
              raise SystemExit('trailing whitespace: ' + ', '.join(bad))
          PY

      - name: Validate official frontend and Rust CI paths
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          lock_before="$(git hash-object src-tauri/Cargo.lock)"
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --manifest-path src-tauri/Cargo.toml
          git checkout -- src-tauri/Cargo.lock
          test "$(git hash-object src-tauri/Cargo.lock)" = "$lock_before"
          git diff --exit-code -- src-tauri/Cargo.lock

      - name: Commit only validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-kitchen-head-fix-strict.yml
          git rm tools/apply_kitchen_hostile_review_fixes.py
          if [ -f .github/workflows/fix-kitchen-head-provenance.yml ]; then
            git rm .github/workflows/fix-kitchen-head-provenance.yml
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            README.md \
            src-tauri/src/db.rs \
            src-tauri/src/kitchen.rs \
            src-tauri/src/lib.rs \
            src/components/RepoCard.tsx
          test -z "$(git diff --cached --name-only | grep '^src-tauri/Cargo.lock$' || true)"
          git commit -m "Address Kitchen orchestration review findings"
          git push origin HEAD:feature/comfy-kitchen-management
