name: Apply durable Kitchen restore state fix

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - tools/apply-kitchen-restore-state.py
      - .github/workflows/apply-kitchen-restore-state.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply checked state-machine fix
        shell: pwsh
        run: |
          python tools/apply-kitchen-restore-state.py
          git diff --check
      - name: Validate frontend and backend
        shell: pwsh
        run: |
          npm ci
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          git diff --exit-code -- src-tauri/Cargo.lock
          git diff --check
      - name: Commit validated fix
        shell: pwsh
        run: |
          Remove-Item tools/apply-kitchen-restore-state.py
          Remove-Item .github/workflows/apply-kitchen-restore-state.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Make ComfyUI Kitchen restore durable and reversible"
          git push origin HEAD:feature/comfy-kitchen-management
