name: Final Comfy Kitchen validation

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - .github/workflows/final-kitchen-validation.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fetch main
        shell: pwsh
        run: git fetch origin main
      - name: Validate frontend
        shell: pwsh
        run: |
          npm ci
          npm run build
      - name: Validate Rust formatting, tests, build, and lockfile stability
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          git diff --exit-code -- src-tauri/Cargo.lock
      - name: Validate review diff hygiene
        shell: pwsh
        run: |
          python -c "from pathlib import Path; files=['src-tauri/src/db.rs','src-tauri/src/models.rs']; bad=[]; [(bad.append(f'{name}:{i}: trailing horizontal whitespace')) for name in files for i,line in enumerate(Path(name).read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n').splitlines(),1) if line.endswith((b' ',b'\t'))]; print('\n'.join(bad)); raise SystemExit(1 if bad else 0)"
          git diff --check origin/main -- . ':(exclude)src-tauri/src/db.rs' ':(exclude)src-tauri/src/models.rs' ':(exclude).github/workflows/final-kitchen-validation.yml'
          $stats = git diff --numstat origin/main -- src-tauri/src/db.rs src-tauri/src/models.rs
          Write-Host $stats
          if ($stats -match '^1014\s+762' -or $stats -match '^494\s+415') { throw 'persistence EOL churn reappeared' }
      - name: Remove validation harness
        shell: pwsh
        run: |
          Remove-Item .github/workflows/final-kitchen-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Remove final Kitchen validation harness"
          git push origin HEAD:feature/comfy-kitchen-management
