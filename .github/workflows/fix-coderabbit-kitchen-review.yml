name: Validate final Kitchen review fixes

on:
  push:
    branches:
      - feature/comfy-kitchen-management

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0

      - name: Apply exact review fixes
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_coderabbit_kitchen_review.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          grep -Fq 'trimmed == ".patcher-build"' src-tauri/src/git.rs
          grep -Fq 'nested/.patcher-build/user-file.txt' src-tauri/src/git.rs
          test "$(grep -F 'kitchenPreviewRequestSeq.current += 1;' src/App.tsx | wc -l | tr -d ' ')" -ge 2
          git diff --check -- src-tauri/src/git.rs src/App.tsx

      - name: Validate permanent CI command path
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          lock_before="$(git hash-object src-tauri/Cargo.lock)"
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --manifest-path src-tauri/Cargo.toml
          git checkout -- src-tauri/Cargo.lock
          test "$(git hash-object src-tauri/Cargo.lock)" = "$lock_before"
          git diff --exit-code -- src-tauri/Cargo.lock

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-coderabbit-kitchen-review.yml
          git rm tools/fix_coderabbit_kitchen_review.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/git.rs src/App.tsx
          expected=$'.github/workflows/fix-coderabbit-kitchen-review.yml\nsrc-tauri/src/git.rs\nsrc/App.tsx\ntools/fix_coderabbit_kitchen_review.py'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --cached --check
          git commit -m "Address final Kitchen review findings"
          git push origin HEAD:feature/comfy-kitchen-management
