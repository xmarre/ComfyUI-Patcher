name: Fix Kitchen HEAD provenance

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - .github/workflows/fix-kitchen-head-provenance.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact invariant fix
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('src-tauri/src/kitchen.rs'); s=p.read_text(encoding='utf-8'); old='    let head_sha = rev_parse(repo_path, \"HEAD\").await?;'; new='    let head_sha = rev_parse(repo_path, \"HEAD\").await?.ok_or_else(|| {\n        AppError::Git(\n            \"cannot materialize Comfy Kitchen source: repository HEAD could not be resolved\"\n                .to_string(),\n        )\n    })?;'; assert s.count(old)==1, f'expected one HEAD resolution anchor, found {s.count(old)}'; p.write_text(s.replace(old,new,1), encoding='utf-8', newline='\\n')"
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check -- src-tauri/src/kitchen.rs
      - name: Validate ordinary Rust test/build path
        shell: pwsh
        run: |
          $lockBefore = (Get-FileHash src-tauri/Cargo.lock -Algorithm SHA256).Hash
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --manifest-path src-tauri/Cargo.toml
          git checkout -- src-tauri/Cargo.lock
          $lockAfter = (Get-FileHash src-tauri/Cargo.lock -Algorithm SHA256).Hash
          if ($lockBefore -ne $lockAfter) { throw 'Cargo.lock restore failed after unlocked validation' }
      - name: Commit validated fix
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-kitchen-head-provenance.yml
          git checkout -- src-tauri/Cargo.lock
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/kitchen.rs
          git diff --cached --check
          git commit -m "Require resolvable Kitchen HEAD before materialization"
          git push origin HEAD:feature/comfy-kitchen-management
