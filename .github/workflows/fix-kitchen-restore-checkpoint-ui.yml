name: Validate Kitchen Restore checkpoint UI

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - .github/workflows/fix-kitchen-restore-checkpoint-ui.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0

      - name: Apply exact Restore checkpoint/UI transform
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_kitchen_restore_checkpoint_ui.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          grep -Fq 'Local source changes stay in place and are retained in the rollback checkpoint' src/components/RepoCard.tsx
          grep -Fq 'hasTrackedUpdate' src/components/RepoCard.tsx
          grep -Fq 'create_checkpoint_if_needed(' src-tauri/src/lib.rs
          grep -Fq 'clean_untracked_paths(path, &current_status.untracked_files)' src-tauri/src/lib.rs
          git diff --check -- CHANGELOG.md README.md src/components/RepoCard.tsx src-tauri/src/lib.rs

      - name: Validate permanent CI command path
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          lock_before="$(git hash-object src-tauri/Cargo.lock)"
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --manifest-path src-tauri/Cargo.toml
          git checkout -- src-tauri/Cargo.lock
          test "$(git hash-object src-tauri/Cargo.lock)" = "$lock_before"
          git diff --exit-code -- src-tauri/Cargo.lock

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-kitchen-restore-checkpoint-ui.yml
          git rm tools/fix_kitchen_restore_checkpoint_ui.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md README.md src/components/RepoCard.tsx src-tauri/src/lib.rs
          test -z "$(git diff --cached --name-only | grep '^src-tauri/Cargo.lock$' || true)"
          git diff --cached --check
          git commit -m "Preserve dirty Kitchen Restore checkpoints"
          git push origin HEAD:feature/comfy-kitchen-management
