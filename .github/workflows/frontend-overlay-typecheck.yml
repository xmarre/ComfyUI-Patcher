name: temporary frontend overlay typecheck

on:
  pull_request:
    paths:
      - .github/workflows/frontend-overlay-typecheck.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact upstream frontend base
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI_frontend
          ref: e7fc8af32cb77c88ae5a88ffe782c2b91287093e
          fetch-depth: 0
          path: frontend

      - name: Assemble Patcher overlay order
        shell: bash
        env:
          GIT_AUTHOR_NAME: Overlay diagnostics
          GIT_AUTHOR_EMAIL: diagnostics@localhost
          GIT_COMMITTER_NAME: Overlay diagnostics
          GIT_COMMITTER_EMAIL: diagnostics@localhost
        run: |
          git -C frontend fetch --no-tags https://github.com/xmarre/ComfyUI_frontend.git 3bb5cfdf95580ad7647b3c1f4b4fef22814a4d80
          git -C frontend merge --no-edit --no-ff FETCH_HEAD
          git -C frontend fetch --no-tags origin refs/pull/10841/head
          git -C frontend merge --no-edit --no-ff FETCH_HEAD
          git -C frontend log -3 --pretty=oneline

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install exact frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Focused persistence regression tests
        working-directory: frontend
        run: |
          pnpm exec vitest run --maxWorkers=2 \
            src/platform/workflow/persistence/composables/useWorkflowPersistenceV2.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.quotaSafety.test.ts \
            src/platform/workflow/persistence/stores/workflowDraftStoreV2.rollbackSafety.test.ts

      - name: Focused drag and drop regression tests
        working-directory: frontend
        run: |
          pnpm exec vitest run --maxWorkers=2 \
            src/composables/node/useNodeDragAndDrop.test.ts \
            src/composables/usePaste.test.ts \
            src/renderer/extensions/vueNodes/composables/useVueNodeDragAndDrop.test.ts \
            src/renderer/extensions/vueNodes/components/LGraphNode.test.ts \
            src/utils/__tests__/eventUtils.test.ts \
            src/scripts/app.test.ts

      - name: Verify Vite production build
        working-directory: frontend
        run: pnpm exec vite build --config vite.config.mts
