name: Normalize Kitchen diff line endings

on:
  push:
    branches:
      - feature/comfy-kitchen-management
    paths:
      - .github/workflows/normalize-kitchen-eol.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/comfy-kitchen-management
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Normalize only newline encoding
        shell: bash
        run: |
          set -euo pipefail
          targets=(src-tauri/src/db.rs src-tauri/src/models.rs)
          git diff --ignore-space-at-eol origin/main -- "${targets[@]}" > /tmp/before.diff
          python - <<'PY'
          from pathlib import Path
          import subprocess

          targets = [Path("src-tauri/src/db.rs"), Path("src-tauri/src/models.rs")]
          for path in targets:
              base = subprocess.check_output(["git", "show", f"origin/main:{path.as_posix()}"])
              current = path.read_bytes()
              logical = current.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              base_crlf = base.count(b"\r\n")
              base_lf = base.count(b"\n")
              newline = b"\r\n" if base_crlf and base_crlf == base_lf else b"\n"
              rewritten = logical if newline == b"\n" else logical.replace(b"\n", b"\r\n")
              if rewritten != current:
                  path.write_bytes(rewritten)
          PY
          git diff --ignore-space-at-eol origin/main -- "${targets[@]}" > /tmp/after.diff
          cmp /tmp/before.diff /tmp/after.diff
          git diff --check
      - name: Commit normalized files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/normalize-kitchen-eol.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/db.rs src-tauri/src/models.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize Kitchen management diff line endings"
          git push origin HEAD:feature/comfy-kitchen-management
