name: pnpm-layout-repro

on:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ComfyUI Frontend
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI_frontend
          ref: main
          path: frontend

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Establish known-good install
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Inspect compiler peer topology
        shell: bash
        run: |
          cd frontend
          echo "pnpm=$(pnpm --version)"
          echo "node=$(node --version)"
          find node_modules/.pnpm -path '*/@vue/compiler-sfc' -maxdepth 5 -print -exec ls -ld {} \; | head -100
          echo "--- fallback entry ---"
          ls -ld node_modules/.pnpm/node_modules/@vue/compiler-sfc
          readlink -f node_modules/.pnpm/node_modules/@vue/compiler-sfc

      - name: Corrupt only pnpm fallback compiler link and reproduce
        shell: bash
        run: |
          cd frontend
          rm -rf node_modules/.pnpm/node_modules/@vue/compiler-sfc
          test ! -e node_modules/.pnpm/node_modules/@vue/compiler-sfc
          set +e
          pnpm build > ../corrupt-build.log 2>&1
          rc=$?
          set -e
          cat ../corrupt-build.log
          test "$rc" -ne 0
          grep -F "Cannot find package '@vue/compiler-sfc'" ../corrupt-build.log
          grep -F "node_modules/.pnpm/local-pkg@1.2.1/node_modules/local-pkg/dist/index.mjs" ../corrupt-build.log

      - name: Test v0.1.21 forced reinstall
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile --force
          if [ -e node_modules/.pnpm/node_modules/@vue/compiler-sfc ]; then
            echo "force reinstall restored fallback compiler link"
          else
            echo "force reinstall DID NOT restore fallback compiler link"
          fi
          set +e
          pnpm build > ../forced-build.log 2>&1
          rc=$?
          set -e
          cat ../forced-build.log
          echo "forced_build_rc=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "FORCE_RECOVERED=1"
          else
            echo "FORCE_RECOVERED=0"
          fi

      - name: Validate clean node_modules recovery
        shell: bash
        run: |
          cd frontend
          rm -rf node_modules
          pnpm install --frozen-lockfile
          test -e node_modules/.pnpm/node_modules/@vue/compiler-sfc
          pnpm build
