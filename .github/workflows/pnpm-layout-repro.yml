name: pnpm-layout-repro

on:
  push:
    branches:
      - experiment/pnpm-layout-repro-20260928
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ComfyUI Frontend
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI_frontend
          ref: main
          path: frontend

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Materialize known-good dependency graph
        shell: bash
        run: |
          cd frontend
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'
          import { pathToFileURL } from 'node:url'
          const localPkg = pathToFileURL(process.cwd() + '/node_modules/.pnpm/local-pkg@1.2.1/node_modules/local-pkg/dist/index.mjs')
          const req = createRequire(localPkg)
          console.log('compiler-sfc resolves to:', req.resolve('@vue/compiler-sfc/package.json'))
          NODE

      - name: Reproduce missing hidden peer link
        shell: bash
        run: |
          cd frontend
          rm -rf node_modules/.pnpm/node_modules/@vue/compiler-sfc
          set +e
          pnpm build > ../broken-build.log 2>&1
          rc=$?
          set -e
          cat ../broken-build.log
          test "$rc" -ne 0
          grep -F "Cannot find package '@vue/compiler-sfc'" ../broken-build.log
          grep -F "node_modules/.pnpm/local-pkg@1.2.1/node_modules/local-pkg/dist/index.mjs" ../broken-build.log

      - name: Test v0.1.21 force recovery
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile --force
          set +e
          pnpm build > ../force-build.log 2>&1
          rc=$?
          set -e
          cat ../force-build.log
          echo "force_build_exit=$rc"
          if [ "$rc" -ne 0 ]; then
            grep -F "Cannot find package '@vue/compiler-sfc'" ../force-build.log
          fi

      - name: Validate clean frozen reinstall
        if: always()
        shell: bash
        run: |
          cd frontend
          rm -rf node_modules
          pnpm install --frozen-lockfile
          pnpm build
