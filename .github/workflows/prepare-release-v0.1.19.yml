name: Prepare release v0.1.19

on:
  push:
    branches:
      - release/v0.1.19

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.19
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_release_v0_1_19.py
          grep -Fq '"version": "0.1.19"' package.json
          grep -Fq 'version = "0.1.19"' src-tauri/Cargo.toml
          grep -Fq '## [0.1.19] - 2026-09-10' CHANGELOG.md
          grep -Fq '[0.1.19]: https://github.com/xmarre/ComfyUI-Patcher/compare/v0.1.18...v0.1.19' CHANGELOG.md
          git diff --check

      - name: Validate release command path
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo build --manifest-path src-tauri/Cargo.toml
          cp "$RUNNER_TEMP/Cargo.lock.release" src-tauri/Cargo.lock
          git diff --check

      - name: Validate exact release surface and commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=e7986942658707881e9154f94009f0fc2b7eac35
          git rm .github/workflows/prepare-release-v0.1.19.yml
          git rm tools/prepare_release_v0_1_19.py

          expected=$'.github/release-request.json\nCHANGELOG.md\npackage-lock.json\npackage.json\nsrc-tauri/Cargo.lock\nsrc-tauri/Cargo.toml\nsrc-tauri/tauri.conf.json'
          actual="$(git diff --name-only "$BASE" | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = "0.1.19"
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          package_lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          request = json.loads(Path(".github/release-request.json").read_text(encoding="utf-8"))
          cargo_toml = Path("src-tauri/Cargo.toml").read_text(encoding="utf-8")
          cargo_lock = Path("src-tauri/Cargo.lock").read_text(encoding="utf-8")

          versions = {
              package["version"],
              package_lock["version"],
              package_lock["packages"][""]["version"],
              tauri["version"],
              request["version"],
              re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', cargo_toml).group(1),
              re.search(r'(?ms)\[\[package\]\]\s*name = "comfyui-patcher"\s*version = "([^"]+)"', cargo_lock).group(1),
          }
          if versions != {expected}:
              raise SystemExit(f"release versions disagree: {sorted(versions)}")
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-request.json CHANGELOG.md package-lock.json package.json src-tauri/Cargo.lock src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "Release v0.1.19"
          git push origin HEAD:release/v0.1.19
