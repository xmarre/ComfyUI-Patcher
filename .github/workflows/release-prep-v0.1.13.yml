name: release-prep-v0.1.13

on:
  push:
    branches:
      - release/v0.1.13
    paths:
      - ".github/workflows/release-prep-v0.1.13.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.13

      - name: Prepare synchronized release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_version = "0.1.12"
          new_version = "0.1.13"

          def replace_bytes(path: str, old: bytes, new: bytes, expected: int) -> None:
              p = Path(path)
              data = p.read_bytes()
              actual = data.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s) of {old!r}, found {actual}")
              p.write_bytes(data.replace(old, new))

          replace_bytes(
              "package.json",
              b'"version": "0.1.12"',
              b'"version": "0.1.13"',
              1,
          )
          replace_bytes(
              "package-lock.json",
              b'"version": "0.1.12"',
              b'"version": "0.1.13"',
              2,
          )
          replace_bytes(
              "src-tauri/Cargo.toml",
              b'version = "0.1.12"',
              b'version = "0.1.13"',
              1,
          )

          cargo_lock = Path("src-tauri/Cargo.lock")
          cargo_data = cargo_lock.read_bytes()
          replaced = False
          for newline in (b"\r\n", b"\n"):
              old = b'name = "comfyui-patcher"' + newline + b'version = "0.1.12"'
              new = b'name = "comfyui-patcher"' + newline + b'version = "0.1.13"'
              if cargo_data.count(old) == 1:
                  cargo_lock.write_bytes(cargo_data.replace(old, new, 1))
                  replaced = True
                  break
          if not replaced:
              raise SystemExit("src-tauri/Cargo.lock: could not find the root comfyui-patcher 0.1.12 package stanza exactly once")

          replace_bytes(
              "src-tauri/tauri.conf.json",
              b'"version": "0.1.12"',
              b'"version": "0.1.13"',
              1,
          )
          replace_bytes(
              ".github/release-request.json",
              b'"version": "0.1.12"',
              b'"version": "0.1.13"',
              1,
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          if "## [0.1.13]" in changelog:
              raise SystemExit("CHANGELOG.md already contains a 0.1.13 section")

          intro = (
              "All notable changes to ComfyUI Patcher are documented here. Earlier release notes\n"
              "remain available on the [GitHub Releases](https://github.com/xmarre/ComfyUI-Patcher/releases) page.\n\n"
          )
          if changelog.count(intro) != 1:
              raise SystemExit("CHANGELOG.md introduction marker was not found exactly once")

          section = """## [0.1.13] - 2026-08-15

This patch release makes tracked-repository recovery precise so reconciliation repairs only the repositories that actually need it.

### Changed

- Reconciliation warnings now expose a **Repair this repo** action for each tracked repository currently flagged as dirty or drifted.
- The bulk recovery action now hard-resets only the currently flagged repair set and explicitly states how many other tracked repositories will remain untouched.

### Fixed

- Repairing reconciliation drift no longer hard-resets every tracked repository in an installation when only one or a few repositories need recovery.
- Unrelated managed repositories no longer receive recovery operations or checkpoints during normal reconciliation repair.

"""
          changelog = changelog.replace(intro, intro + section, 1)

          compare_marker = "[0.1.12]: https://github.com/xmarre/ComfyUI-Patcher/compare/v0.1.11...v0.1.12"
          if changelog.count(compare_marker) != 1:
              raise SystemExit("CHANGELOG.md 0.1.12 compare-link marker was not found exactly once")
          changelog = changelog.replace(
              compare_marker,
              "[0.1.13]: https://github.com/xmarre/ComfyUI-Patcher/compare/v0.1.12...v0.1.13\n" + compare_marker,
              1,
          )
          changelog_path.write_text(changelog, encoding="utf-8")

          checks = {
              "package.json": 1,
              "package-lock.json": 2,
              "src-tauri/Cargo.toml": 1,
              "src-tauri/Cargo.lock": 1,
              "src-tauri/tauri.conf.json": 1,
              ".github/release-request.json": 1,
          }
          for path, expected in checks.items():
              data = Path(path).read_text(encoding="utf-8")
              actual = data.count(new_version)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s) of {new_version}, found {actual}")
          PY

          git diff --check
          git diff -- .github/release-request.json CHANGELOG.md package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json

      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-request.json CHANGELOG.md package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Prepare v0.1.13"
          git push origin HEAD:release/v0.1.13
