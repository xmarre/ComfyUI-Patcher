name: windows-build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Python for dependency-guard regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Kitchen requirement protection
        run: python -m unittest discover -s tests -p test_managed_kitchen_pip.py -v

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Rust backend
        run: cargo build --manifest-path src-tauri/Cargo.toml
